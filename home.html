<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Game — Start Screen</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .home-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
            padding: 24px;
            text-align: center;
            animation: slideIn 0.6s ease;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 40px;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
        }

        .top-bar .player-tag {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* Main title */
        .main-title {
            font-size: 3.5rem;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-cyan);
            text-shadow: 6px 6px 0 var(--neon-purple);
            animation: glitch 2.5s infinite alternate;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .subtitle-tag {
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        /* Menu box */
        .menu-box {
            background: rgba(0, 0, 0, 0.65);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink), inset 0 0 20px rgba(255,0,204,0.05);
            padding: 40px 50px;
            display: inline-block;
            position: relative;
            min-width: 340px;
            margin-bottom: 40px;
        }

        .menu-box::before { content: '+'; position: absolute; top: 12px;  left: 16px;  color: var(--neon-cyan); font-family: var(--pixel-font); }
        .menu-box::after  { content: '+'; position: absolute; bottom: 12px; right: 16px; color: var(--neon-cyan); font-family: var(--pixel-font); }

        .menu-btn {
            display: block;
            width: 100%;
            background: transparent;
            color: #fff;
            font-family: var(--pixel-font);
            font-size: 1rem;
            padding: 18px 0;
            border: none;
            transition: 0.25s;
            cursor: pointer;
            position: relative;
            animation: pulse 1.5s infinite;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            animation: none;
            transform: scale(1.06);
        }

        .menu-btn::before {
            content: '▶ ';
            opacity: 0;
            transition: opacity 0.2s;
        }

        .menu-btn:hover::before { opacity: 1; }

        .menu-divider {
            border: none;
            border-top: 1px dashed rgba(255,255,255,0.15);
            margin: 6px 0;
        }

        .menu-secondary {
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 14px 0;
            animation: none;
        }

        .menu-secondary:hover {
            color: var(--neon-purple);
            text-shadow: 0 0 8px var(--neon-purple);
            transform: none;
        }

        /* Scoreboard */
        .scoreboard {
            width: 100%;
            max-width: 520px;
            margin: 0 auto 30px;
        }

        .score-table-title {
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: var(--neon-yellow, #ffe600);
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 0 0 8px var(--neon-yellow, #ffe600);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            transition: background 0.2s;
        }

        .score-row:hover { background: rgba(255,255,255,0.03); }

        .score-row .rank  { color: var(--neon-pink); min-width: 32px; }
        .score-row .name  { color: #ccc; flex: 1; padding: 0 12px; }
        .score-row .val   { color: var(--neon-cyan); }
        .score-row.me     { background: rgba(51,204,255,0.06); border-color: rgba(51,204,255,0.3); }
        .score-row.me .name { color: var(--neon-green); }

        /* Player stats */
        .player-stats-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .stat-item { text-align: center; }
        .stat-item .label {
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .stat-item .value {
            font-family: var(--pixel-font);
            font-size: 0.9rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .coin-tag {
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            color: var(--neon-purple);
            animation: blink 0.8s infinite;
            margin-top: 10px;
        }

        .deleteUser {
            animation: none;
            width:fit-content;
            padding: 10px;
            height: fit-content;
            font-family: var(--pixel-font);
            margin-top: 10px;
            background-color: var(--pixel-font);
            
        }

        /* If portfolio already unlocked — show a badge */
        .unlocked-badge {
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            color: var(--neon-green);
            background: rgba(0,255,136,0.08);
            border: 1px solid rgba(0,255,136,0.3);
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }
        @media (max-width: 640px) {
            .main-title { font-size: 2.2rem; }
            .menu-box { min-width: unset; width: 100%; padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <div id="cursor-wisp"></div>
    <div id="cursor-trail"></div>
    <div id="achievement-toast"></div>

    <div class="home-wrap">
        <!-- Top bar -->
        <div class="top-bar">
            <span class="player-tag" id="player-tag">▶ PLAYER: ---</span>
            <button class="rpg-btn secondary" style="font-size:0.5rem; padding:8px 14px;" onclick="Auth.logout()">LOGOUT</button>
        </div>

        <h1 class="main-title">PORTFOLIO<br>GAME</h1>
        <p class="subtitle-tag">v2.0 — CYBERPUNK EDITION</p>

        <!-- Player stats row -->
        <div class="player-stats-card">
            <div class="stat-item">
                <div class="label">HIGH SCORE</div>
                <div class="value" id="stat-hs">0</div>
            </div>
            <div class="stat-item">
                <div class="label">LEVEL</div>
                <div class="value" id="stat-level">1</div>
            </div>
            <div class="stat-item">
                <div class="label">TITLE</div>
                <div class="value" id="stat-title" style="color:var(--neon-pink); text-shadow:0 0 8px var(--neon-pink); font-size:0.65rem;">ROOKIE</div>
            </div>
            <div class="stat-item">
                <div class="label">ACHIEVEMENTS</div>
                <div class="value" id="stat-ach">0</div>
            </div>
        </div>

        <!-- Unlocked badge -->
        <div class="unlocked-badge" id="unlocked-badge">✓ PORTFOLIO PREVIOUSLY UNLOCKED — ENTER DIRECTLY</div>

        <!-- Main Menu -->
        <div class="menu-box">
            <button class="menu-btn" id="start-btn" onclick="navigate('game.html')">▶ START GAME</button>
            <hr class="menu-divider">
            <button class="menu-btn menu-secondary" id="portfolio-btn" onclick="goPortfolio()">ENTER PORTFOLIO</button>
            <hr class="menu-divider">
            <!-- <button class="menu-btn menu-secondary" onclick="navigate('index.html')">CHANGE PLAYER</button> -->
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-table-title">🏆 TOP SCORES</div>
            <div id="score-list">
                <div class="score-row" style="text-align:center; color:#555; font-family:var(--pixel-font); font-size:0.5rem; padding:20px;">
                    No scores yet. Be the first!
                </div>
            </div>
        </div>

        <!-- <div class="coin-tag deleteUser">INSERT COIN TO CONTINUE</div> -->
        <button class="coin-tag deleteUser" onclick="delUser()">DELETE ACCOUNT</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Auth guard
        const session = Auth.require();
        if (!session) throw new Error('Redirecting...');

        const username = session.username;

        StarField.init();
        Cursor.init();

        // Populate UI
        document.getElementById('player-tag').textContent = '▶ PLAYER: ' + username.toUpperCase();

        const hs    = Store.getHighScore(username);
        const level = LevelSystem.getLevel(hs);
        const title = LevelSystem.getTitle(hs);
        const achs  = Store.getAchievements(username).length;

        document.getElementById('stat-hs').textContent    = hs;
        document.getElementById('stat-level').textContent = level;
        document.getElementById('stat-title').textContent = title;
        document.getElementById('stat-ach').textContent   = achs + '/' + Achievements.list.length;

        // Show unlock badge if portfolio already cleared
        if (Store.isPortfolioUnlocked(username)) {
            document.getElementById('unlocked-badge').style.display = 'block';
        }

        // Build leaderboard
        function buildLeaderboard() {
            const allUsers = Store.getUsers();
            const scores   = Store.getHighScores();
            const rows = [];

            for (const key in allUsers) {
                if (scores[allUsers[key].display] !== undefined) {
                    rows.push({ name: allUsers[key].display, score: scores[allUsers[key].display] });
                }
            }

            rows.sort((a, b) => b.score - a.score);

            const list = document.getElementById('score-list');
            if (!rows.length) return;

            const medals = ['🥇', '🥈', '🥉'];
            list.innerHTML = rows.slice(0, 8).map((r, i) => `
                <div class="score-row ${r.name === username ? 'me' : ''}">
                    <span class="rank">${medals[i] || (i + 1) + '.'}</span>
                    <span class="name">${r.name.toUpperCase()}${r.name === username ? ' ◀ YOU' : ''}</span>
                    <span class="val">${r.score.toLocaleString()}</span>
                </div>
            `).join('');
        }

        buildLeaderboard();

        function goPortfolio() {
            if (Store.isPortfolioUnlocked(username)) {
                navigate('portfolio.html');
            } else {
                Toast.show('🔒 LOCKED', 'Portfolio Locked', 'Complete the game first to unlock the portfolio!');
            }
        }

        // Delete User
        function delUser() {
    const delUsr = document.querySelector(".deleteUser");

    delUsr.addEventListener('click', () => {

        const usrConfirmation = confirm(
            "Do you confirm deletion of your account? All data and achievements will be permanently lost."
        );

        if (usrConfirmation) {
            Store.deleteUser(username);
            Auth.logout();
        }

    });
}
    </script>
</body>
</html>
