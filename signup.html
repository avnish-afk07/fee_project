<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Game — Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        .auth-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            animation: slideIn 0.5s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .auth-logo h1 {
            font-size: 1.6rem;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-cyan);
            text-shadow: 4px 4px 0 var(--neon-purple);
            animation: glitch 3s infinite alternate;
            line-height: 1.4;
        }

        .auth-logo p {
            font-size: 0.7rem;
            color: var(--neon-green);
            margin-top: 12px;
            font-family: var(--pixel-font);
        }

        .auth-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 0, 204, 0.25);
            border-radius: 8px;
            padding: 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.08);
            position: relative;
        }

        .auth-card::before,
        .auth-card::after {
            content: '◈';
            position: absolute;
            color: var(--neon-pink);
            font-size: 18px;
            opacity: 0.6;
        }
        .auth-card::before { top: 10px; left: 14px; }
        .auth-card::after  { bottom: 10px; right: 14px; }

        .auth-card h2 {
            font-size: 0.8rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 28px;
            text-align: center;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
        }

        .auth-footer a:hover { text-shadow: 0 0 8px var(--neon-cyan); }

        .auth-card .rpg-btn { width: 100%; text-align: center; }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            transition: 0.3s;
        }

        .password-strength .bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>
    <div id="cursor-wisp"></div>
    <div id="cursor-trail"></div>

    <div class="auth-wrap">
        <div class="auth-logo">
            <h1>PORTFOLIO<br>GAME</h1>
            <p>▶ CREATE YOUR PLAYER PROFILE ◀</p>
        </div>

        <div class="auth-card">
            <h2>// NEW PLAYER</h2>

            <div id="signup-alert" class="alert error"></div>
            <div id="signup-success" class="alert success"></div>

            <div class="form-group">
                <label for="username">CHOOSE USERNAME</label>
                <input type="text" id="username" placeholder="Min. 3 characters" autocomplete="off" spellcheck="false" maxlength="20">
            </div>

            <div class="form-group">
                <label for="password">CHOOSE PASSWORD</label>
                <input type="password" id="password" placeholder="Min. 6 characters" oninput="checkStrength(this.value)">
                <div class="password-strength"><div class="bar" id="strength-bar"></div></div>
            </div>

            <div class="form-group">
                <label for="confirm">CONFIRM PASSWORD</label>
                <input type="password" id="confirm" placeholder="Re-enter your password">
            </div>

            <button class="rpg-btn" id="signup-btn" onclick="doSignup()">CREATE ACCOUNT ▶</button>
        </div>

        <div class="auth-footer">
            <span>Already have an account? </span>
            <a href="index.html">LOGIN HERE</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const session = Store.getSession();
        if (session) navigate('home.html');

        StarField.init();
        Cursor.init();

        function checkStrength(val) {
            const bar = document.getElementById('strength-bar');
            let score = 0;
            if (val.length >= 6)  score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9!@#$]/.test(val)) score++;

            const widths = ['0%', '25%', '50%', '75%', '100%'];
            const colors = ['transparent', '#ff4444', '#ffe600', '#00b4ff', '#00ff88'];
            bar.style.width      = widths[score];
            bar.style.background = colors[score];
        }

        function doSignup() {
            const username  = document.getElementById('username').value.trim();
            const password  = document.getElementById('password').value;
            const confirm   = document.getElementById('confirm').value;
            const alertEl   = document.getElementById('signup-alert');
            const successEl = document.getElementById('signup-success');
            const btn       = document.getElementById('signup-btn');

            alertEl.classList.remove('show');
            successEl.classList.remove('show');

            btn.textContent = 'CREATING...';
            btn.disabled    = true;

            setTimeout(() => {
                const result = Auth.signup(username, password, confirm);
                if (result.error) {
                    alertEl.textContent = result.error;
                    alertEl.classList.add('show');
                    btn.textContent = 'CREATE ACCOUNT ▶';
                    btn.disabled    = false;
                } else {
                    successEl.textContent = 'Account created! Logging you in...';
                    successEl.classList.add('show');
                    // Award first login ach
                    Achievements.award(result.user.username, 'first_login');
                    setTimeout(() => navigate('home.html'), 1000);
                }
            }, 400);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSignup();
        });
    </script>
</body>
</html>
