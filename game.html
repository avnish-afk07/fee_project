<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Game — Play</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow: hidden; height: 100vh; }

        /* ── HUD (top bar) ── */
        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(51,204,255,0.2);
            backdrop-filter: blur(8px);
            font-family: var(--pixel-font);
        }

        .hud-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .hud-label { font-size: 0.45rem; color: var(--text-muted); letter-spacing: 2px; }
        .hud-value { font-size: 0.85rem; }

        #hud-score { color: var(--neon-pink);   text-shadow: 0 0 8px var(--neon-pink); }
        #hud-timer { color: var(--neon-cyan);   text-shadow: 0 0 8px var(--neon-cyan); }
        #hud-orbs  { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }
        #hud-hi    { color: var(--neon-green);  text-shadow: 0 0 8px var(--neon-green); }

        #hud-timer.danger { color: var(--danger); text-shadow: 0 0 14px var(--danger); animation: pulse 0.5s infinite; }

        /* ── GAME AREA ── */
        #game-area {
            position: fixed;
            inset: 60px 0 0 0;
        }

        /* ── PLAYER CURSOR ── */
        #player {
            position: fixed;
            width: 44px;
            height: 44px;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px rgba(51,204,255,0.2);
            background: rgba(0, 242, 255, 0.08);
            mix-blend-mode: screen;
            transition: width 0.1s, height 0.1s, border-color 0.1s, box-shadow 0.1s;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px #fff;
        }

        /* ── ORB ── */
        .orb {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: none;
            z-index: 50;
            transition: transform 0.2s, opacity 0.3s;
        }

        .orb .orb-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: orbPulse 2s ease-in-out infinite;
        }

        .orb.collected { transform: scale(2); opacity: 0; pointer-events: none; }

        .orb-purple .orb-inner {
            background: radial-gradient(circle, rgba(188,19,254,0.9), transparent);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 16px var(--neon-purple);
        }

        .orb-cyan .orb-inner {
            background: radial-gradient(circle, rgba(51,204,255,0.9), transparent);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 16px var(--neon-cyan);
        }

        .orb-pink .orb-inner {
            background: radial-gradient(circle, rgba(255,0,204,0.9), transparent);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 16px var(--neon-pink);
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50%       { transform: scale(1.15); opacity: 1; }
        }

        /* ── PARTICLE ── */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: particleFly 0.7s ease-out forwards;
        }

        @keyframes particleFly {
            0%   { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* ── COMBO POPUP ── */
        .combo-popup {
            position: fixed;
            pointer-events: none;
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            z-index: 1000;
            animation: comboFly 0.8s ease-out forwards;
        }

        @keyframes comboFly {
            0%   { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        /* ── OVERLAY SCREENS ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            animation: fadeIn 0.4s ease;
        }

        .overlay.active { display: flex; }

        .overlay h1 {
            font-size: 2.5rem;
            animation: glitch 1s infinite;
            line-height: 1.4;
        }

        .overlay p {
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            color: var(--text-muted);
            line-height: 2;
        }

        .overlay .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 10px 0;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 24px 36px;
            border-radius: 8px;
        }

        .overlay .stat-blk .lbl { font-family: var(--pixel-font); font-size: 0.45rem; color: #666; margin-bottom: 6px; }
        .overlay .stat-blk .val { font-family: var(--pixel-font); font-size: 0.85rem; }

        .new-record { color: var(--neon-yellow, #ffe600); text-shadow: 0 0 10px var(--neon-yellow, #ffe600); font-family: var(--pixel-font); font-size: 0.65rem; animation: blink 0.8s infinite; }

        .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

        /* ── DIFFICULTY INDICATOR ── */
        #difficulty-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #111;
            z-index: 600;
        }

        #difficulty-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-yellow, #ffe600), var(--danger));
            transition: width 1s linear;
            box-shadow: 0 0 6px;
        }

        /* ── COUNTDOWN ── */
        #countdown-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            font-family: var(--pixel-font);
            font-size: 5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 30px var(--neon-cyan);
            animation: fadeIn 0.2s ease;
        }

        #countdown-overlay.hidden { display: none; }
    </style>
</head>
<body>
    <div id="cursor-trail" style="display:none"></div>

    <!-- Countdown -->
    <div id="countdown-overlay">3</div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-block">
            <span class="hud-label">SCORE</span>
            <span class="hud-value" id="hud-score">0</span>
        </div>
        <div class="hud-block">
            <span class="hud-label">ORBS</span>
            <span class="hud-value" id="hud-orbs">0 / 12</span>
        </div>
        <div class="hud-block">
            <span class="hud-label">TIME</span>
            <span class="hud-value" id="hud-timer">30</span>
        </div>
        <div class="hud-block">
            <span class="hud-label">BEST</span>
            <span class="hud-value" id="hud-hi">0</span>
        </div>
    </div>

    <!-- Player cursor -->
    <div id="player"></div>

    <!-- Game canvas -->
    <div id="game-area"></div>

    <!-- Difficulty bar -->
    <div id="difficulty-bar"><div id="difficulty-fill"></div></div>

    <!-- ── GAME OVER OVERLAY ── -->
    <div class="overlay" id="gameover-screen">
        <h1 class="glow-pink">GAME<br>OVER</h1>
        <p>Time's up, Agent. The encryption held.</p>
        <div class="stats-grid">
            <div class="stat-blk"><div class="lbl">SCORE</div>     <div class="val glow-pink"  id="go-score">0</div></div>
            <div class="stat-blk"><div class="lbl">ORBS</div>      <div class="val glow-purple" id="go-orbs">0</div></div>
            <div class="stat-blk"><div class="lbl">HIGH SCORE</div><div class="val glow-cyan"   id="go-hi">0</div></div>
        </div>
        <div class="new-record" id="go-newrecord" style="display:none">✦ NEW HIGH SCORE ✦</div>
        <div class="btn-row">
            <button class="rpg-btn" onclick="restartGame()">RETRY ↺</button>
            <button class="rpg-btn secondary" onclick="navigate('home.html')">MAIN MENU</button>
        </div>
    </div>

    <!-- ── VICTORY OVERLAY ── -->
    <div class="overlay" id="victory-screen">
        <h1 class="glow-cyan">ACCESS<br>GRANTED</h1>
        <p>Encryption bypassed. Portfolio unlocked.</p>
        <div class="stats-grid">
            <div class="stat-blk"><div class="lbl">FINAL SCORE</div><div class="val glow-cyan"   id="vc-score">0</div></div>
            <div class="stat-blk"><div class="lbl">TIME LEFT</div>  <div class="val glow-green"   id="vc-time">0s</div></div>
            <div class="stat-blk"><div class="lbl">HIGH SCORE</div> <div class="val glow-pink"    id="vc-hi">0</div></div>
        </div>
        <div class="new-record" id="vc-newrecord" style="display:none">✦ NEW HIGH SCORE ✦</div>
        <div class="btn-row">
            <button class="rpg-btn" onclick="navigate('portfolio.html')">ENTER PORTFOLIO ▶</button>
            <button class="rpg-btn secondary" onclick="restartGame()">PLAY AGAIN ↺</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        /* ──────────────────────────────────────
           AUTH GUARD
        ────────────────────────────────────── */
        const session = Auth.require();
        if (!session) throw new Error('No session');
        const username = session.username;

        /* ──────────────────────────────────────
           GAME CONFIG
        ────────────────────────────────────── */
        const CONFIG = {
            TOTAL_ORBS:    12,
            GAME_TIME:     30,        // seconds
            BASE_SPEED:    1.8,       // orb drift px/frame
            SPEED_RAMP:    0.06,      // added per second elapsed
            SCORE_BASE:    50,        // per orb
            SCORE_TIME_BONUS: 5,      // * seconds remaining
            ORB_COLORS:    ['orb-purple', 'orb-cyan', 'orb-pink'],
        };

        /* ──────────────────────────────────────
           STATE
        ────────────────────────────────────── */
        let state = {
            score:       0,
            orbsCollected: 0,
            timeLeft:    CONFIG.GAME_TIME,
            running:     false,
            startedAt:   null,
            combo:       0,
            orbs:        [],          // { el, x, y, vx, vy }
            mouseX:      -200,
            mouseY:      -200,
            timerInterval: null,
            rafId:       null,
        };

        const highScore = Store.getHighScore(username);
        document.getElementById('hud-hi').textContent = highScore;

        /* ──────────────────────────────────────
           COUNTDOWN
        ────────────────────────────────────── */
        function startCountdown() {
            const el = document.getElementById('countdown-overlay');
            let n = 3;
            el.textContent = n;

            const tick = setInterval(() => {
                n--;
                if (n <= 0) {
                    clearInterval(tick);
                    el.classList.add('hidden');
                    startGame();
                } else {
                    el.textContent = n;
                    el.style.color = n === 1 ? 'var(--neon-pink)' : 'var(--neon-cyan)';
                }
            }, 900);
        }

        /* ──────────────────────────────────────
           GAME INIT
        ────────────────────────────────────── */
        function startGame() {
            // Reset state
            state.score         = 0;
            state.orbsCollected = 0;
            state.timeLeft      = CONFIG.GAME_TIME;
            state.running       = true;
            state.startedAt     = Date.now();
            state.combo         = 0;
            state.orbs          = [];

            document.getElementById('hud-score').textContent = '0';
            document.getElementById('hud-orbs').textContent  = '0 / ' + CONFIG.TOTAL_ORBS;
            document.getElementById('hud-timer').textContent = CONFIG.GAME_TIME;
            document.getElementById('hud-timer').classList.remove('danger');

            document.getElementById('gameover-screen').classList.remove('active');
            document.getElementById('victory-screen').classList.remove('active');

            spawnOrbs();
            startTimer();
            gameLoop();
        }

        /* ──────────────────────────────────────
           SPAWN ORBS
        ────────────────────────────────────── */
        function spawnOrbs() {
            const area = document.getElementById('game-area');
            area.innerHTML = '';
            state.orbs = [];

            const W = window.innerWidth;
            const H = window.innerHeight - 60;

            for (let i = 0; i < CONFIG.TOTAL_ORBS; i++) {
                const colorClass = CONFIG.ORB_COLORS[i % CONFIG.ORB_COLORS.length];
                const el = document.createElement('div');
                el.className = 'orb ' + colorClass;

                const inner = document.createElement('div');
                inner.className = 'orb-inner';
                el.appendChild(inner);

                // Random position
                const x = 60 + Math.random() * (W - 120);
                const y = 60 + Math.random() * (H - 120);

                el.style.left = x + 'px';
                el.style.top  = y + 'px';

                // Random velocity
                const angle = Math.random() * Math.PI * 2;
                const spd   = CONFIG.BASE_SPEED * (0.7 + Math.random() * 0.6);

                area.appendChild(el);
                state.orbs.push({ el, x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd });
            }
        }

        /* ──────────────────────────────────────
           TIMER
        ────────────────────────────────────── */
        function startTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (!state.running) return;

                state.timeLeft--;
                document.getElementById('hud-timer').textContent = state.timeLeft;

                // Difficulty bar
                const pct = ((CONFIG.GAME_TIME - state.timeLeft) / CONFIG.GAME_TIME) * 100;
                document.getElementById('difficulty-fill').style.width = pct + '%';

                if (state.timeLeft <= 8) {
                    document.getElementById('hud-timer').classList.add('danger');
                }

                if (state.timeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        /* ──────────────────────────────────────
           GAME LOOP (orb movement + collision)
        ────────────────────────────────────── */
        function gameLoop() {
            if (!state.running) return;

            const W   = window.innerWidth;
            const H   = window.innerHeight - 60;
            const elapsed = (Date.now() - state.startedAt) / 1000;
            const speed   = CONFIG.BASE_SPEED + CONFIG.SPEED_RAMP * elapsed;

            state.orbs.forEach(orb => {
                if (orb.el.classList.contains('collected')) return;

                orb.x += orb.vx * (speed / CONFIG.BASE_SPEED);
                orb.y += orb.vy * (speed / CONFIG.BASE_SPEED);

                // Bounce off walls
                if (orb.x < 0 || orb.x > W - 44) { orb.vx *= -1; orb.x = Math.max(0, Math.min(W - 44, orb.x)); }
                if (orb.y < 0 || orb.y > H - 44)  { orb.vy *= -1; orb.y = Math.max(0, Math.min(H - 44, orb.y)); }

                orb.el.style.left = orb.x + 'px';
                orb.el.style.top  = orb.y + 'px';

                // Collision with player
                const dx = (orb.x + 22) - state.mouseX;
                const dy = (orb.y + 22) - state.mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 42) {
                    collectOrb(orb);
                }
            });

            state.rafId = requestAnimationFrame(gameLoop);
        }

        /* ──────────────────────────────────────
           COLLECT ORB
        ────────────────────────────────────── */
        function collectOrb(orb) {
            orb.el.classList.add('collected');
            state.orbsCollected++;
            state.combo++;

            // Score = base + combo bonus + time bonus
            const comboBonus = Math.min(state.combo - 1, 5) * 20;
            const pts        = CONFIG.SCORE_BASE + comboBonus;
            state.score += pts;

            // Update HUD
            document.getElementById('hud-score').textContent = state.score;
            document.getElementById('hud-orbs').textContent  = state.orbsCollected + ' / ' + CONFIG.TOTAL_ORBS;

            // Pulse player cursor
            const player = document.getElementById('player');
            player.style.width       = '66px';
            player.style.height      = '66px';
            player.style.borderColor = 'var(--neon-pink)';
            player.style.boxShadow   = '0 0 30px var(--neon-pink)';
            setTimeout(() => {
                player.style.width       = '44px';
                player.style.height      = '44px';
                player.style.borderColor = '#fff';
                player.style.boxShadow   = '0 0 20px var(--neon-cyan)';
            }, 180);

            // Particle burst
            spawnParticles(state.mouseX, state.mouseY, orb.el.classList.contains('orb-pink') ? '#ff00cc' : orb.el.classList.contains('orb-cyan') ? '#33ccff' : '#bc13fe');

            // Combo popup
            if (state.combo >= 2) showComboPopup(state.mouseX, state.mouseY, state.combo, pts);

            // Win check
            if (state.orbsCollected >= CONFIG.TOTAL_ORBS) {
                victory();
            }
        }

        /* ──────────────────────────────────────
           PARTICLES
        ────────────────────────────────────── */
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left       = x + 'px';
                p.style.top        = y + 'px';
                p.style.background = color;
                p.style.boxShadow  = '0 0 6px ' + color;

                const angle = (i / 8) * Math.PI * 2;
                const dist  = 40 + Math.random() * 30;
                p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
                p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 700);
            }
        }

        /* ──────────────────────────────────────
           COMBO POPUP
        ────────────────────────────────────── */
        function showComboPopup(x, y, combo, pts) {
            const el = document.createElement('div');
            el.className   = 'combo-popup';
            el.style.left  = (x - 40) + 'px';
            el.style.top   = (y - 30) + 'px';
            el.style.color = combo >= 5 ? 'var(--neon-yellow, #ffe600)' : 'var(--neon-pink)';
            el.textContent = combo >= 5 ? '🔥 x' + combo + ' !' : '+' + pts;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        /* ──────────────────────────────────────
           GAME OVER
        ────────────────────────────────────── */
        function gameOver() {
            endGame(false);
        }

        /* ──────────────────────────────────────
           VICTORY
        ────────────────────────────────────── */
        function victory() {
            // Time bonus
            const timeBonus = state.timeLeft * CONFIG.SCORE_TIME_BONUS;
            state.score += timeBonus;
            endGame(true);
        }

        /* ──────────────────────────────────────
           END GAME (shared)
        ────────────────────────────────────── */
        function endGame(won) {
            state.running = false;
            clearInterval(state.timerInterval);
            cancelAnimationFrame(state.rafId);

            // Save score
            const isNewRecord = Store.saveHighScore(username, state.score);
            Store.setLastScore(username, state.score);
            const finalHi = Store.getHighScore(username);

            // Achievements
            if (won) {
                Store.unlockPortfolio(username);
                Achievements.award(username, 'first_win');
                if (state.score >= 800)  Achievements.award(username, 'speed_demon');
                if (finalHi >= 1000)     Achievements.award(username, 'high_scorer');
                if (LevelSystem.getLevel(finalHi) >= 5) Achievements.award(username, 'level5');
                if (state.timeLeft > 0)  Achievements.award(username, 'perfectionist');
            } else {
                Achievements.award(username, 'comeback_kid');
            }

            setTimeout(() => {
                if (won) {
                    document.getElementById('vc-score').textContent = state.score;
                    document.getElementById('vc-time').textContent  = state.timeLeft + 's';
                    document.getElementById('vc-hi').textContent    = finalHi;
                    if (isNewRecord) document.getElementById('vc-newrecord').style.display = 'block';
                    document.getElementById('victory-screen').classList.add('active');
                } else {
                    document.getElementById('go-score').textContent = state.score;
                    document.getElementById('go-orbs').textContent  = state.orbsCollected;
                    document.getElementById('go-hi').textContent    = finalHi;
                    if (isNewRecord) document.getElementById('go-newrecord').style.display = 'block';
                    document.getElementById('gameover-screen').classList.add('active');
                }
            }, 400);
        }

        /* ──────────────────────────────────────
           RESTART
        ────────────────────────────────────── */
        function restartGame() {
            document.getElementById('gameover-screen').classList.remove('active');
            document.getElementById('victory-screen').classList.remove('active');
            document.getElementById('countdown-overlay').classList.remove('hidden');
            document.getElementById('countdown-overlay').style.color = 'var(--neon-cyan)';

            cancelAnimationFrame(state.rafId);
            clearInterval(state.timerInterval);

            startCountdown();
        }

        /* ──────────────────────────────────────
           MOUSE TRACKING
        ────────────────────────────────────── */
        const player = document.getElementById('player');

        document.addEventListener('mousemove', e => {
            state.mouseX = e.clientX;
            state.mouseY = e.clientY;

            player.style.left = e.clientX + 'px';
            player.style.top  = e.clientY + 'px';
        });

        /* ──────────────────────────────────────
           BOOT
        ────────────────────────────────────── */
        StarField.init(document.body, 40);
        startCountdown();
    </script>
</body>
</html>
